# Daft Punk -- "Instant Crush" (feat. Julian Casablancas)
#
# STATUS (accuracy pass v3.3): CORRECTED A WRONG SECTION PICK. v3.1/v3.2's
# chorus candidate (209.77s+) was found by taking the single best-matching
# repeated window in the song -- but that turned out to be guitar-solo-
# adjacent material, not the sung chorus (confirmed: it didn't cross-
# validate against any other widely-separated part of the track, and the
# song's actual energy contour shows it sits inside one long high-energy
# block that also contains the ~3:18 guitar solo, with no clean boundary
# between them). User feedback that it "doesn't sound like the song at
# all" was correct.
#
# Root-caused and fixed by requiring cross-validation instead of trusting
# one best pair: computed the whole-song RMS energy contour (choruses are
# almost always the loudest/fullest sections) to find genuinely isolated
# candidate peaks, then searched for a chroma-similar match between two
# widely-separated peaks (not just adjacent windows). Found chorus is the
# 8-bar unit at 88.50s-105.50s, and -- critically -- it independently
# matches THREE more widely-separated points in the track (237.00s,
# 263.25s, 298.00s; similarity 0.87-0.91 each, all outside the solo
# region), which the wrong candidate never did. tools/analyze_reference.py
# now does this cross-validation automatically for any section
# (find_all_occurrences) and averages chroma across all confirmed
# occurrences before chord-matching (average_chroma_occurrences) --
# cancels out per-occurrence noise, raising mean harmony confidence from
# 0.32 (original, wrong section, full mix) to 0.67 (corrected section,
# 4-occurrence average, isolated harmonic stem). 14 chord events, all
# independently corroborated across 4 real recordings of the same 8 bars.
#
# MELODY and BASS remain NOT ready: Demucs' vocal-isolation model produced
# near-silent output for this track (Instant Crush's vocoded/processed
# vocal likely doesn't match what the model was trained on), and bass
# isolation didn't clear the confidence bar on the corrected section
# either. An earlier pass's fully-invented chord/melody data (built from a
# documented chord-change sequence + a made-up melody, not audio) remains
# archived and is not loaded -- the current chords are real audio-derived
# data, not a resurrection of that, but are still "reference_derived",
# never "verified": a generic close-position triad built from each
# measured root+quality, not the actual recorded voicing.
#
# To improve further:
#   1. Melody: try a different/newer Demucs model (--name argument), or a
#      dedicated vocal-isolation model, since htdemucs' default vocals
#      stem failed for this track's vocal processing.
#   2. Preferred alternative: obtain a MIDI file or your own transcription
#      LEGALLY and run: .venv\Scripts\python.exe tools\import_midi.py <path>
#
# See songs/instant_crush/NOTES_STATUS.md for the full investigation.

title: "Instant Crush"
artist: "Daft Punk feat. Julian Casablancas"
time_signature: [4, 4]

# MEASURED from the local reference recording (librosa beat-tracking +
# tempogram, both methods agreed within 1 BPM -- see
# songs/instant_crush/reference_analysis/beat_grid.json). Bar-1/downbeat
# phase alignment is NOT verified -- beat 0 here is audio time 0, not a
# confirmed downbeat.
tempo_events:
  - beat: 0
    bpm: 112.35

notes_disclaimer: >
  Chorus CHORDS are reference_derived (Demucs stem separation + sub-beat
  chroma template matching against the isolated harmonic stem, averaged
  across 4 independently cross-validated occurrences of the chorus
  throughout the track, confidence >= 0.5) -- real measured audio
  evidence, not invented, but still an algorithmic estimate with a generic
  voicing, never "verified". An earlier chorus-section pick was found to
  be wrong (guitar-solo-adjacent material) and has been corrected -- see
  song.yaml's header comment and NOTES_STATUS.md for the investigation.
  Melody and bass are NOT ready: vocal isolation failed for this track,
  and bass isolation didn't clear the confidence bar. A previous pass's
  fully-invented chord/melody data remains archived and is not loaded.
  The lead/electric-guitar section (~3:18) remains fully unverified. See
  songs/instant_crush/reference_analysis/ for the full candidate data.

