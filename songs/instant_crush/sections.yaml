# Section boundaries for Instant Crush -- see NOTES_STATUS.md.
#
# `chorus` below is derived from a MEASURED chroma-self-similarity
# candidate against the local reference recording (similarity score 0.999
# on the base 8-bar unit -- see songs/instant_crush/reference_analysis/sections.json),
# not an arbitrary guess. The base 8-bar (209.77s-227.23s) window was
# extended to 16 bars (209.77s-244.69s) because the immediately following
# 8 bars matched it at 0.996 similarity too -- real evidence of a second
# repeat, not a length guess. Still a heuristic, not a human-confirmed
# structural label -- confirm by ear with
# tools/reference_inspect.py --start 209.77 --end 244.69 before fully trusting it.
#
# `lead_guitar` remains the user-provided ~3:18 approximate timestamp,
# recomputed at the now-measured 112.35 BPM (was computed against the old
# 120 BPM guess). Its end_beat has been trimmed to where the measured
# chorus candidate begins (they overlapped before the trim) -- this is an
# INFERENCE (solo ends where the next chorus starts), not a verified
# boundary; still needs confirmation by ear.

sections:
  - id: chorus
    name: "Chorus"
    # Measured chroma-repeat candidate, extended by one confirmed repeat:
    # 209.77s-244.69s (16 bars) at 112.35 BPM.
    start_beat: 392.79
    end_beat: 458.19
    difficulty: medium
    loop_default: true

  - id: lead_guitar
    name: "Lead / Electric Guitar (~3:18)"
    # ~198s (user-provided) at the measured 112.35 BPM. end_beat trimmed to
    # the measured chorus candidate's start (392.79) rather than an
    # arbitrary +32-beat placeholder -- both boundaries still unverified.
    start_beat: 370.75
    end_beat: 392.79
    difficulty: hard
    loop_default: false
