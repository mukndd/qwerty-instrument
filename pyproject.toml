[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwerty-instrument"
version = "0.1.0"
description = "Low-latency QWERTY keyboard instrument + practice engine (AULA F75 / Instant Crush profile)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pywin32>=306; platform_system=='Windows'",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
vst = ["pedalboard>=0.9"]
reference = ["soundfile>=0.12", "librosa>=0.10"]
reference-stems = ["demucs>=4.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
